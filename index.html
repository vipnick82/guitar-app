<!doctype html>
<html lang="bg">
<head>

<link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<title>Guitar Practice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#29f093;--gold-d:#1ab86e;--txt:#eeeeee;--muted:#737373;--line:#1e1e1e;
 --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:26px}
html,body{height:100%;background:#060606}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent;
 overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
 background:radial-gradient(120% 60% at 50% -8%,#121212 0%,#0a0a0a 42%,#060606 78%) no-repeat #060606}
a{color:var(--gold);text-decoration:none}a:hover{color:#69ffb9}
button,select,.beat,input[type=range]{touch-action:manipulation;font-family:inherit}
.grain{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.05;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNDAnIGhlaWdodD0nMTQwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nLjg1JyBudW1PY3RhdmVzPSczJy8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9JzE0MCcgaGVpZ2h0PScxNDAnIGZpbHRlcj0ndXJsKCNuKScvPjwvc3ZnPg==")}

.app{max-width:432px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
 padding:calc(12px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-left)) calc(30px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-right))}

/* ---------- app bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;height:34px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:700;letter-spacing:2.4px;color:#666666}
.live{width:6px;height:6px;border-radius:50%;background:#343434;box-shadow:none;transition:background .25s,box-shadow .25s}
.app[data-playing="1"] .live{background:var(--gold);box-shadow:0 0 10px rgba(41,240,147,.8);animation:live 1.1s ease-in-out infinite}
.chip{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.6px;color:#707070;
 background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:999px;padding:5px 11px 5px 9px;
 opacity:0;transform:translateY(-3px);transition:opacity .4s,transform .4s}
.chip.show{opacity:1;transform:none}
.chip.ok{color:var(--gold-d)}
.chip.err{color:#c9524a}
.spin{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(41,240,147,.25);border-top-color:var(--gold);animation:spin .8s linear infinite}
.chip.ok .spin,.chip.err .spin{display:none}

/* ---------- song picker / hero ---------- */
.pick{position:relative;padding:2px 0 4px}
.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:2.6px;color:#5b5b5b;margin-bottom:9px}
.pick h2{font-size:27px;line-height:1.12;font-weight:700;letter-spacing:-.5px;color:#f5f5f5;text-wrap:pretty;
 padding-right:30px;transition:opacity .25s}
.pickHint{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;letter-spacing:.3px;color:#666666}
.pickHint b{color:var(--gold-d);font-weight:600}
.chev{position:absolute;right:0;top:26px;width:30px;height:30px;border-radius:var(--r-sm);
 background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
 display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:10px;transition:background .18s}
.pick select{position:absolute;inset:-8px -6px;width:calc(100% + 12px);opacity:0;appearance:none;-webkit-appearance:none;
 border:0;background:transparent;font-size:16px;cursor:pointer}
.pick select:active + .chev,.pick select:focus + .chev{background:rgba(41,240,147,.16)}

/* ---------- anchor pill ---------- */
.anchorWrap{display:flex;flex:none}
.anchor{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
 background:linear-gradient(180deg,#171717,#111111);border:1px solid #2a2a2a;border-top-color:#3a3a3a;color:#bcbcbc;border-radius:var(--r-md);
 padding:13px 18px;font-size:13.5px;font-weight:600;letter-spacing:.2px;cursor:pointer;
 box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.045);
 transition:transform .12s,box-shadow .2s,border-color .2s,color .2s,background .25s}
.anchor:active{transform:translateY(1px) scale(.995);box-shadow:0 1px 4px rgba(0,0,0,.5),inset 0 2px 6px rgba(0,0,0,.55)}
.anchor.on{background:linear-gradient(180deg,#103a26,#0b2418);border-color:rgba(41,240,147,.55);color:var(--gold);
 box-shadow:0 0 26px rgba(41,240,147,.18),0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(41,240,147,.22)}
.anchor.dis{opacity:.32;cursor:default;box-shadow:none}

/* ---------- cards ---------- */
.card{background:linear-gradient(178deg,#121212 0%,#0e0e0e 55%,#0a0a0a 100%);
 border:1px solid var(--line);border-top-color:rgba(255,255,255,.08);border-radius:var(--r-lg);padding:16px 16px 18px;
 box-shadow:0 18px 34px -20px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.05) inset}
.cardHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.label{font-size:9.5px;font-weight:700;letter-spacing:2.4px;color:#626262}
.fine{font-size:10px;letter-spacing:.5px;color:#535353;font-variant-numeric:tabular-nums}
.fine b{color:var(--gold-d);font-weight:600}

/* ---------- bar dots ---------- */
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:3px;background:#2e2e2e;transition:width .3s cubic-bezier(.2,.85,.2,1),background .25s,box-shadow .25s}
.dot.on{background:var(--gold);width:26px;box-shadow:0 0 12px rgba(41,240,147,.5)}

/* ---------- chords ---------- */
.chordCard{position:relative;overflow:hidden}
.pulseRing{position:absolute;left:50%;top:52%;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;
 pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(41,240,147,.16),rgba(41,240,147,0) 68%)}
.app.pulse .pulseRing{animation:ring .46s ease-out}
.app.pulse.accent .pulseRing{animation:ring .6s ease-out}
.chords{display:flex;align-items:center;justify-content:center;gap:2px;min-height:216px;perspective:1000px;position:relative}
.slot{flex:0 0 auto;position:relative;padding-bottom:20px;transform-style:preserve-3d}
.slot svg{display:block;width:84px;height:auto}
.frame{border:1px solid #242424;border-top-color:#333333;border-radius:var(--r-md);padding:0 7px 7px;
 background:linear-gradient(176deg,#252525 0%,#161616 46%,#0e0e0e 100%);
 box-shadow:0 10px 22px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.slot.side{opacity:.42;filter:grayscale(.5) brightness(.72);animation:sIn .45s ease-out both}
.slot.side:first-child{transform:rotateY(21deg) scale(.9) translateX(6px)}
.slot.side:last-child{transform:rotateY(-21deg) scale(.9) translateX(-6px)}
.slot.side::after{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:8px;letter-spacing:1.5px;color:#525252}
.slot.side:first-child::after{content:"ПРЕДИШЕН"}
.slot.side:last-child::after{content:"СЛЕДВАЩ"}
.slot.center{opacity:1;z-index:2;margin:0 2px;animation:cIn .42s cubic-bezier(.18,.9,.2,1) both}
.slot.center svg{width:150px}
.slot.center .frame{border:1.5px solid rgba(41,240,147,.72);border-radius:var(--r-md);padding:0 10px 10px;
 background:linear-gradient(176deg,#193d2c 0%,#12221b 48%,#101412 100%);
 box-shadow:0 0 0 6px rgba(41,240,147,.045),0 0 40px rgba(41,240,147,.16),0 22px 34px -16px rgba(0,0,0,.95),
 inset 0 1px 0 rgba(130,255,197,.22),inset 0 -20px 40px rgba(0,0,0,.35)}
.slot.center::after{content:"СЕГА";position:absolute;left:0;right:0;bottom:1px;text-align:center;
 font-size:8.5px;font-weight:700;letter-spacing:2px;color:var(--gold-d)}
.app.flat .slot.side:first-child{transform:scale(.9)}
.app.flat .slot.side:last-child{transform:scale(.9)}

/* ---------- strumming ---------- */
.strum{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.beat{aspect-ratio:1/1;border:1px solid #202020;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
 font-size:17px;color:#343434;background:linear-gradient(180deg,#121212,#0c0c0c);cursor:pointer;user-select:none;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 2px 6px rgba(0,0,0,.4);
 transition:color .18s,border-color .18s,background .18s}
.beat:active{transform:translateY(1px)}
.beat.act{color:rgba(41,240,147,.85);border-color:#13462e;background:linear-gradient(180deg,#101d17,#09140f)}
.beat.hit{color:#0f0f0f;border-color:var(--gold);background:linear-gradient(180deg,#69ffb9,var(--gold));
 animation:hit .32s cubic-bezier(.2,.85,.2,1)}
.beat.hit.rest{color:#747474;border-color:#343434;background:linear-gradient(180deg,#262626,#1a1a1a);
 animation:hitRest .3s ease-out}
.counts{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:9px}
.counts span{text-align:center;font-size:9.5px;letter-spacing:.4px;color:#454545;font-variant-numeric:tabular-nums;transition:color .15s}
.counts span.n{color:#626262}
.app[data-slot="0"] .counts span:nth-child(1),.app[data-slot="1"] .counts span:nth-child(2),
.app[data-slot="2"] .counts span:nth-child(3),.app[data-slot="3"] .counts span:nth-child(4),
.app[data-slot="4"] .counts span:nth-child(5),.app[data-slot="5"] .counts span:nth-child(6),
.app[data-slot="6"] .counts span:nth-child(7),.app[data-slot="7"] .counts span:nth-child(8){color:var(--gold)}
.app.nocounts .counts{display:none}

/* ---------- transport ---------- */
.bpmRow{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2px}
.bpmNum{display:flex;align-items:baseline;gap:6px}
.bpmNum span{font-size:34px;font-weight:700;letter-spacing:-1.2px;color:#f5f5f5;font-variant-numeric:tabular-nums;line-height:1}
.bpmNum i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:1.8px;color:#626262}
.fader{position:relative;height:52px;margin:6px 0 2px}
.faderTrack{position:absolute;left:2px;right:2px;top:22px;height:9px;border-radius:6px;
 background:linear-gradient(180deg,#070707,#141414);box-shadow:inset 0 2px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.04)}
.faderFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;
 background:linear-gradient(180deg,#69ffb9,var(--gold-d));box-shadow:0 0 14px rgba(41,240,147,.35)}
.ticks{position:absolute;left:2px;right:2px;top:38px;height:7px;
 background-image:repeating-linear-gradient(90deg,#2b2b2b 0 1px,transparent 1px 12.5%)}
.faderEnds{position:absolute;left:2px;right:2px;top:0;display:flex;justify-content:space-between;
 font-size:9px;letter-spacing:1.2px;color:#454545}
.fader input[type=range]{position:absolute;left:0;right:0;top:6px;width:100%;height:42px;margin:0;background:transparent;
 -webkit-appearance:none;appearance:none;outline:none}
.fader input[type=range]::-webkit-slider-runnable-track{height:42px;background:transparent}
.fader input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:40px;border-radius:var(--r-sm);
 background:linear-gradient(180deg,#505050 0%,#242424 44%,#373737 100%);border:1px solid #5f5f5f;
 background-image:linear-gradient(180deg,#505050 0%,#242424 44%,#373737 100%),linear-gradient(var(--gold),var(--gold));
 background-size:100% 100%,2px 15px;background-position:0 0,center;background-repeat:no-repeat;
 box-shadow:0 8px 16px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.22) inset,0 -2px 4px rgba(0,0,0,.5) inset;cursor:grab}
.fader input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;
 box-shadow:0 3px 8px rgba(0,0,0,.7),0 0 18px rgba(41,240,147,.28),0 1px 0 rgba(255,255,255,.16) inset}
.fader input[type=range]::-moz-range-track{height:42px;background:transparent}
.fader input[type=range]::-moz-range-thumb{width:24px;height:38px;border-radius:var(--r-sm);border:1px solid #5f5f5f;
 background:linear-gradient(180deg,#505050,#242424 44%,#373737);cursor:grab}

.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.presets button{background:linear-gradient(180deg,#161616,#101010);border:1px solid #242424;border-top-color:#323232;color:#aeaeae;
 border-radius:var(--r-md);padding:11px 0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;
 box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .1s,color .18s,border-color .18s}
.presets button:active{transform:translateY(1px) scale(.98);color:var(--gold);border-color:#1c4a35;
 box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}

.play{width:100%;margin-top:14px;border:0;border-radius:var(--r-xl);padding:19px;font-size:17px;font-weight:700;
 letter-spacing:.3px;cursor:pointer;color:#0f0f0f;font-variant-numeric:tabular-nums;
 display:flex;align-items:center;justify-content:center;gap:9px;
 background:linear-gradient(180deg,#76ffbf 0%,var(--gold) 46%,#16d97e 100%);
 box-shadow:0 12px 26px -8px rgba(41,240,147,.42),0 2px 0 rgba(255,255,255,.25) inset,0 -3px 8px rgba(0,120,64,.35) inset;
 transition:transform .11s,box-shadow .2s,background .3s,color .2s}
.play svg{flex:0 0 auto}
.btnSpin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(15,15,15,.28);border-top-color:currentColor;
 animation:spin .8s linear infinite;flex:0 0 auto}
.play:active{transform:translateY(2px) scale(.99);
 box-shadow:0 3px 10px -4px rgba(41,240,147,.3),0 -2px 6px rgba(0,120,64,.4) inset,0 3px 9px rgba(0,0,0,.45) inset}
.play.on{background:linear-gradient(180deg,#181818,#111111);color:var(--gold);
 box-shadow:0 0 0 1.5px rgba(41,240,147,.6) inset,0 0 30px rgba(41,240,147,.16),0 8px 20px -10px rgba(0,0,0,.9)}
.play.cnt{background:linear-gradient(180deg,#181818,#111111);color:var(--gold);font-size:30px;letter-spacing:4px;
 box-shadow:0 0 0 1.5px rgba(41,240,147,.35) inset,0 0 24px rgba(41,240,147,.12);animation:countPulse .5s ease-out}

.foot{flex:none;text-align:center;font-size:9.5px;letter-spacing:1.4px;color:#3e3e3e;padding:2px 0 0}

@keyframes hit{0%{transform:scale(1)}28%{transform:scale(1.16);box-shadow:0 0 26px rgba(41,240,147,.55)}100%{transform:scale(1.04);box-shadow:0 0 12px rgba(41,240,147,.28)}}
@keyframes hitRest{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1.02)}}
@keyframes ring{0%{opacity:.9;transform:scale(.72)}100%{opacity:0;transform:scale(1.25)}}
@keyframes cIn{0%{opacity:0;transform:scale(.9) translateY(6px);filter:blur(5px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes sIn{0%{opacity:0}100%{opacity:.42}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes countPulse{0%{box-shadow:0 0 0 1.5px rgba(41,240,147,.9) inset,0 0 44px rgba(41,240,147,.3)}100%{box-shadow:0 0 0 1.5px rgba(41,240,147,.35) inset,0 0 24px rgba(41,240,147,.12)}}
@media (max-width:360px){.slot.center svg{width:132px}.slot svg{width:72px}.pick h2{font-size:24px}}
</style>
</head>
<body>
<div class="grain"></div>
<div class="app" id="app">

  <div class="bar">
    <div class="brand"><span class="live"></span>GUITAR PRACTICE</div>
    <div class="chip" id="loadChip"><span class="spin"></span><span id="loadTxt">зареждам мостри</span></div>
  </div>

  <div class="pick">
    <div class="eyebrow">УПРАЖНЕНИЕ</div>
    <h2 id="title">—</h2>
    <div class="pickHint"><b>докосни</b> за друга песен</div>
    <select id="songSel"></select>
    <div class="chev"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
  </div>

  <div class="anchorWrap"><button class="anchor" id="anchorBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.6"/><line x1="12" y1="22" x2="12" y2="7.6"/><path d="M4.8 12H2a10 10 0 0 0 20 0h-2.8"/></svg><span>Anchor chords</span></button></div>

  <section class="card chordCard">
    <div class="cardHead"><span class="label">ПОСЛЕДОВАТЕЛНОСТ</span><span class="fine" id="fineBar">такт —/—</span></div>
    <div class="dots" id="dots"></div>
    <div class="pulseRing"></div>
    <div class="chords" id="chords"></div>
  </section>

  <section class="card">
    <div class="cardHead"><span class="label">STRUMMING PATTERN</span><span class="fine">докосни удар, за да го смениш</span></div>
    <div class="strum" id="strum"></div>
    <div class="counts"><span class="n">1</span><span>&amp;</span><span class="n">2</span><span>&amp;</span><span class="n">3</span><span>&amp;</span><span class="n">4</span><span>&amp;</span></div>
  </section>

  <section class="card">
    <div class="bpmRow"><span class="label">ТЕМПО</span><div class="bpmNum"><span id="bpmVal">60</span><i>BPM</i></div></div>
    <div class="fader">
      <div class="faderEnds"><span>35</span><span>200</span></div>
      <div class="faderTrack"><div class="faderFill" id="faderFill"></div></div>
      <div class="ticks"></div>
      <input type="range" id="bpm" min="35" max="200">
    </div>
    <div class="presets">
      <button data-b="40">40</button><button data-b="60">60</button>
      <button data-b="80">80</button><button data-b="100">100</button>
    </div>
    <button class="play" id="play"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7.5 4.5v15l13-7.5z"/></svg><span>Play</span></button>
  </section>

  <div class="foot" id="foot">ПРОСВИРВАНЕ · 4/4</div>
</div>

<script>
/* ================= ИКОНИ (замяна на emoji глифове) ================= */
const ICONS = {

function chordSVG(name){
  const c = CHORDS[name];
  if(!c) return '<svg viewBox="0 0 122 176"></svg>';
  const pos = c.f.filter(x=>x>0);
  const maxF = pos.length?Math.max(...pos):0, minF = pos.length?Math.min(...pos):0;
  const base = maxF>4 ? minF : 1;
  const NF=5, L=16, SP=18, TOP=52, FH=21;
  const x = i => L + i*SP, y = f => TOP + (f-0.5)*FH;
  const disp = c.label || name;
  const fs = disp.length>4 ? 19 : 24;
  let s = '<svg viewBox="0 0 122 176" xmlns="http://www.w3.org/2000/svg">';
  s += `<text x="61" y="30" fill="#29f093" font-size="${fs}" font-weight="800" text-anchor="middle" font-family="Georgia,serif">${disp}</text>`;
  for(let r=0;r<=NF;r++){
    const yy = TOP + r*FH, nut = (r===0 && base===1);
    s += `<line x1="${L}" y1="${yy}" x2="${x(5)}" y2="${yy}" stroke="${nut?'#aeaeae':'#414141'}" stroke-width="${nut?3:1}" stroke-linecap="round"/>`;
  }
  for(let i=0;i<6;i++)
    s += `<line x1="${x(i)}" y1="${TOP}" x2="${x(i)}" y2="${TOP+NF*FH}" stroke="#535353" stroke-width="1"/>`;
  if(base>1) s += `<text x="${L-6}" y="${y(1)+4}" fill="#818181" font-size="10" text-anchor="end">${base}</text>`;
  if(c.barre && c.barre.fret>=base && c.barre.fret<base+NF){
    const rf = c.barre.fret-base+1;
    s += `<rect x="${x(c.barre.from)-6}" y="${y(rf)-6}" width="${x(c.barre.to)-x(c.barre.from)+12}" height="12" rx="6" fill="#29f093"/>`;
  }
  for(let i=0;i<6;i++){
    const f = c.f[i];
    if(f===-1) s += `<text x="${x(i)}" y="${TOP-6}" fill="#818181" font-size="11" text-anchor="middle">×</text>`;
    else if(f===0) s += `<circle cx="${x(i)}" cy="${TOP-10}" r="4" fill="none" stroke="#c6c6c6" stroke-width="1.4"/>`;
    else{
      const rf = f-base+1; if(rf<1||rf>NF) continue;
      const onBarre = c.barre && c.barre.fret===f && i>=c.barre.from && i<=c.barre.to;
      if(!onBarre) s += `<circle cx="${x(i)}" cy="${y(rf)}" r="7.5" fill="#29f093"/>`;
      if(c.g[i]>0) s += `<text x="${x(i)}" y="${y(rf)+3.6}" fill="#111111" font-size="9.5" font-weight="700" text-anchor="middle">${c.g[i]}</text>`;
    }
  }
  return s+'</svg>';
}

/* ================= ЗВУК: истински мостри на акустична китара =================
   Никакъв синтез. Всяка нота е реален запис на стоманена акустична китара
   (tonejs-instruments / nbrosowsky, GitHub Pages, CORS отворен).

   • Базата са 6-те отворени струни E2 A2 D3 G3 B3 E4 — зареждат се първи,
     за да може да се свири веднага.
   • playbackRate = Math.pow(2, fret/12) спрямо праговете в масива f.
   • Във фонов режим се дозареждат и междинните ноти; щом пристигнат,
     двигателят взима най-близката мостра и транспонирането пада под 1 полутон
     (по-малко транспониране = по-малко изкривяване на дървения тембър). */

let ac=null, master=null, dryBus=null, active=[];
const smp = new Map();                        // midi → AudioBuffer
let coreReady = false, loadFailed = false, loadingCore = null;

function initAudio(){
  if(ac) return;
  // iOS 16.4+: без това Web Audio мълчи, когато страничният ключ е на безшумен режим
  try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  ac = new (window.AudioContext||window.webkitAudioContext)();

  const out = ac.createDynamicsCompressor();
  out.threshold.value=-12; out.knee.value=18; out.ratio.value=2.6;
  out.attack.value=0.008; out.release.value=0.3;
  out.connect(ac.destination);

  master = ac.createGain(); master.gain.value = 0.9; master.connect(out);

  // мострите вече носят звука на дървото — само лек цъфтеж въздух в стаята
  dryBus = ac.createGain(); dryBus.gain.value = 1.0; dryBus.connect(master);
  const send = ac.createGain(); send.gain.value = 0.12; dryBus.connect(send);
  const verb = ac.createConvolver(); verb.buffer = roomIR(1.3, 3.0, 0.45);
  send.connect(verb); verb.connect(master);
}

function roomIR(dur, decay, dampC){
  const sr = ac.sampleRate, len = Math.floor(sr*dur);
  const b = ac.createBuffer(2, len, sr);
  for(let ch=0; ch<2; ch++){
    const d = b.getChannelData(ch); let a=0, c=0;
    for(let i=0;i<len;i++){
      const n = (Math.random()*2-1)*Math.pow(1-i/len, decay);
      a = a*dampC + n*(1-dampC);
      c = c*dampC + a*(1-dampC);
      d[i] = c;
    }
    const pre = Math.floor(sr*0.015);
    for(let i=0;i<pre;i++) d[i] *= i/pre;
  }
  return b;
}

/* ---------- зареждане на мострите ---------- */
async function fetchSample(file){
  for(const host of SMP_HOSTS){
    try{
      const r = await fetch(host + file + '.mp3', {mode:'cors'});
      if(!r.ok) continue;
      return await ac.decodeAudioData(await r.arrayBuffer());
    }catch(e){ /* пробваме следващия хост */ }
  }
  return null;
}

function loadSet(map){
  return Promise.all(Object.entries(map).map(async ([file, midi])=>{
    const buf = await fetchSample(file);
    if(buf) smp.set(midi, buf);
    return !!buf;
  }));
}

function loadCore(){
  if(loadingCore) return loadingCore;
  initAudio();
  loadingCore = loadSet(CORE_SMP).then(res=>{
    coreReady = res.some(Boolean);
    loadFailed = !coreReady;
    if(coreReady) loadSet(EXTRA_SMP);       // останалите — тихо, във фонов режим
    return coreReady;
  });
  return loadingCore;
}

/* ---------- избор на мостра ---------- */
/* Точната нота, ако е налична (без транспониране). Иначе най-близката в рамките
   на 2 полутона. Ако има само отворените струни — мострата на самата струна,
   транспонирана точно с 2^(праг/12). */
function pickSample(midi, openMidi){
  if(smp.has(midi)) return {buf:smp.get(midi), midi:midi};
  for(let d=1; d<=2; d++){
    if(smp.has(midi-d)) return {buf:smp.get(midi-d), midi:midi-d};
    if(smp.has(midi+d)) return {buf:smp.get(midi+d), midi:midi+d};
  }
  if(smp.has(openMidi)) return {buf:smp.get(openMidi), midi:openMidi};
  let best=null, bd=99;
  smp.forEach((b,m)=>{ const dd=Math.abs(m-midi); if(dd<bd){bd=dd; best={buf:b, midi:m};} });
  return best;
}

function playString(t, midi, openMidi, gain){
  const s = pickSample(midi, openMidi);
  if(!s) return;
  const src = ac.createBufferSource();
  src.buffer = s.buf;
  // ключовата формула: транспониране спрямо прага
  src.playbackRate.value = Math.pow(2, (midi - s.midi)/12) * (1 + (Math.random()-0.5)*0.0012);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t+0.004);
  src.connect(g); g.connect(dryBus);
  src.start(t);
  const node = {g:g, target:gain, end:t + s.buf.duration/src.playbackRate.value};
  active.push(node);
  src.onended = ()=>{ const i=active.indexOf(node); if(i>=0) active.splice(i,1); };
}

/* Заглушаване на звънящите струни при смяна на акорд.
   setTargetAtTime тръгва точно от стойността в момент t и се приближава
   експоненциално към целта — както дланта ляга върху струните, без пукане. */
function mute(t, amount, tau){
  active.forEach(n=>{
    if(n.end > t){
      n.target = Math.max(0.00005, n.target*amount);
      try{
        n.g.gain.cancelScheduledValues(t);
        n.g.gain.setTargetAtTime(n.target, t, tau);
      }catch(e){}
    }
  });
}

let lastChord = null;
function strum(t, name, dir, accent){
  name = A(name);
  const c = CHORDS[name]; if(!c || !coreReady) return;
  if(lastChord !== null) lastChord===name ? mute(t,0.55,0.045) : mute(t,0.18,0.030);
  lastChord = name;

  const idx=[]; for(let i=0;i<6;i++) if(c.f[i]>=0) idx.push(i);
  const order = dir==='U' ? idx.slice().reverse() : idx;             // надолу от басите, нагоре от високите
  const spread = (dir==='U' ? 0.0105 : 0.016) * (accent?0.88:1) * (0.92+Math.random()*0.16);
  const base = (dir==='U' ? 0.42 : 0.55) * (accent?1.14:1);
  order.forEach((s,k)=>{
    const tilt = dir==='U' ? (1-k*0.10) : (1-k*0.06);
    playString(t + k*spread + Math.random()*0.0012,
               OPEN[s] + c.f[s], OPEN[s],
               Math.max(0.06, base*tilt*(0.93+Math.random()*0.14)));
  });
}

function click(t, accent){
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type='sine'; o.frequency.value = accent?1500:1000;
  f.type='bandpass'; f.frequency.value = accent?1500:1000; f.Q.value=1.2;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(accent?0.20:0.10,t+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+0.07);
}

function prewarm(){ /* мострите се кешират глобално — няма какво да се подгрява */ }

/* ================= UI ================= */
function buildSelect(){
  const sel = $('songSel');
  let html='', last='';
  LIST.forEach((s,i)=>{
    if(s.grp!==last){ if(last) html+='</optgroup>'; html+=`<optgroup label="${s.grp}">`; last=s.grp; }
    html += `<option value="${i}">${s.n}</option>`;
  });
  sel.innerHTML = html+'</optgroup>';
  sel.onchange = e => load(+e.target.value);
}

function load(i){
  stop();
  cur = JSON.parse(JSON.stringify(LIST[i]));
  bpm = cur.b; $('bpm').value = bpm; $('bpmVal').textContent = bpm;
  bar = 0; slot = 0;
  $('title').textContent = cur.n;
  renderAnchorBtn(); renderDots(); renderChords(); renderStrum();
  if(ac) setTimeout(prewarm, 20);
}

/* --- Anchor chords: пръсти 3 и 4 остават на място между акордите --- */
function anchorable(){ return cur ? cur.c.some(n=>ANCHOR[n]) : false; }

function renderAnchorBtn(){
  const b = $('anchorBtn'), ok = anchorable();
  b.className = 'anchor' + (ok ? (anchorOn?' on':'') : ' dis');
  b.innerHTML = ICONS.anchor + '<span>' + (ok ? (anchorOn ? 'Anchored chords ON' : 'Anchor chords')
                     : 'Няма anchor версия') + '</span>';
}

$('anchorBtn').onclick = ()=>{
  if(!anchorable()) return;
  anchorOn = !anchorOn;
  renderAnchorBtn(); renderChords();
  lastChord = null;
  if(ac) prewarm();
};

function renderDots(){ $('dots').innerHTML = cur.c.map((_,i)=>`<div class="dot ${i===bar?'on':''}"></div>`).join(''); }
function renderChords(){
  const n = cur.c.length;
  const cell=(name,cls)=>`<div class="slot ${cls}"><div class="frame">${chordSVG(A(name))}</div></div>`;
  $('chords').innerHTML = cell(cur.c[(bar-1+n)%n],'side')+cell(cur.c[bar],'center')+cell(cur.c[(bar+1)%n],'side');
}
function renderStrum(){
  $('strum').innerHTML = cur.p.map((v,i)=>`<div class="beat ${v!=='-'?'act':''}" data-i="${i}">${v==='U'?'↑':'↓'}</div>`).join('');
  document.querySelectorAll('.beat').forEach(el=>{
    el.onclick = ()=>{ const i=+el.dataset.i, v=cur.p[i];
      cur.p[i] = v==='-' ? (i%2===0?'D':'U') : (v==='D'?'U':'-'); renderStrum(); };
  });
}
function highlight(){
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on', i===bar));
}

/* ================= ТАЙМИНГ ================= */
let nextTime=0, timer=null, queue=[], countIn=0, lastBar=-1;
const LOOKAHEAD=0.15, TICK=25;

function schedule(){
  while(nextTime < ac.currentTime + LOOKAHEAD){
    if(countIn > 0){
      click(nextTime, true);
      queue.push({t:nextTime, cnt:countIn});
      countIn--;
      nextTime += 60/bpm;                       // отброяване по четвъртини
    } else {
      if(slot%2===0) click(nextTime, slot===0);
      const v = cur.p[slot];
      if(v!=='-') strum(nextTime, cur.c[bar], v, slot===0);
      queue.push({t:nextTime, bar:bar, slot:slot});
      nextTime += (60/bpm)/2;
      slot++;
      if(slot>=8){ slot=0; bar=(bar+1)%cur.c.length; }
    }
  }
}

function draw(){
  if(!playing) return;
  const now = ac.currentTime;
  let ev = null;
  while(queue.length && queue[0].t <= now+0.02) ev = queue.shift();
  if(ev){
    if(ev.cnt !== undefined){
      $('play').textContent = ev.cnt;
      $('play').className = 'play cnt';
      document.querySelectorAll('.beat').forEach(el=>el.classList.remove('hit','rest'));
    } else {
      const p = $('play');
      if(p.className!=='play on'){ p.className='play on'; p.innerHTML = ICONS.stop + '<span>Stop</span>'; }
      if(ev.bar !== lastBar){ lastBar = ev.bar; bar = ev.bar; renderChords(); highlight(); }
      document.querySelectorAll('.beat').forEach((el,i)=>{
        el.classList.toggle('hit', i===ev.slot);
        el.classList.toggle('rest', i===ev.slot && cur.p[i]==='-');
      });
    }
  }
  requestAnimationFrame(draw);
}

let starting = false;
function start(){
  initAudio();
  if(ac.state==='suspended') ac.resume();

  // мострите трябва да са в паметта, преди да тръгне метрономът
  if(!coreReady){
    if(starting) return;
    starting = true;
    const b = $('play');
    b.className = 'play'; b.innerHTML = ICONS.spin + '<span>Зареждам китарата…</span>';
    loadCore().then(ok=>{
      starting = false;
      if(!ok){ b.innerHTML = ICONS.warn + '<span>Няма връзка към мострите</span>'; return; }
      start();
    });
    return;
  }

  keepAwake(true);
  playing = true;
  bar=0; slot=0; queue=[]; lastBar=-1; lastChord=null; active=[];
  countIn = 3;                                   // 3 · 2 · 1 и тръгва
  nextTime = ac.currentTime + 0.25;
  $('play').textContent = '3'; $('play').className='play cnt';
  timer = setInterval(schedule, TICK);
  requestAnimationFrame(draw);
}

/* Екранът не заспива, докато свириш (iOS 16.4+, Android Chrome) */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && playing) keepAwake(true);
});

function stop(){
  keepAwake(false);
  playing = false;
  if(timer) clearInterval(timer);
  timer=null; queue=[]; lastChord=null;
  if(ac) mute(ac.currentTime, 0.015, 0.07);
  const p = $('play'); if(p){ p.className='play'; p.innerHTML = ICONS.play + '<span>Play</span>'; }
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('hit','rest'));
  bar = 0; if(cur){ renderChords(); highlight(); }
}

/* ================= КОНТРОЛИ ================= */
$('play').onclick = ()=> playing ? stop() : start();
$('bpm').oninput = e => { bpm=+e.target.value; $('bpmVal').textContent=bpm; };
document.querySelectorAll('.presets button').forEach(b=>{
  b.onclick = ()=>{ bpm=+b.dataset.b; $('bpm').value=bpm; $('bpmVal').textContent=bpm; };
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); playing?stop():start(); }
  if(e.code==='ArrowUp'){ e.preventDefault(); bpm=Math.min(200,bpm+5); $('bpm').value=bpm; $('bpmVal').textContent=bpm; }
  if(e.code==='ArrowDown'){ e.preventDefault(); bpm=Math.max(35,bpm-5); $('bpm').value=bpm; $('bpmVal').textContent=bpm; }
});

buildSelect();
load(0);

// мострите тръгват да се теглят веднага при отваряне, за да е Play моментален
setTimeout(()=>{ try{ loadCore(); }catch(e){} }, 200);

// офлайн режим (работи само по https, т.е. на GitHub Pages — не при отваряне от диска)
if('serviceWorker' in navigator)
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>


<script>
/* Презентационен слой. Чете само състоянието, което приложението вече е
   изписало в DOM (класове .hit / .on, стойността на #bpm, глобалните флагове
   на аудио двигателя). Нищо от логиката не се пипа. */
window.__polish = function(){
  const app = document.getElementById('app');
  const strum = document.getElementById('strum');
  const play = document.getElementById('play');
  const chip = document.getElementById('loadChip');
  const chipTxt = document.getElementById('loadTxt');
  const fine = document.getElementById('fineBar');
  const fill = document.getElementById('faderFill');
  const bpm = document.getElementById('bpm');
  if(!app || !strum || app.dataset.wired) return;
  app.dataset.wired = '1';

  const pulse = accent => {
    app.classList.remove('pulse','accent');
    void app.offsetWidth;
    app.classList.add('pulse');
    if(accent) app.classList.add('accent');
  };

  const readBar = () => {
    const dots = Array.from(document.querySelectorAll('#dots .dot'));
    const i = dots.findIndex(d => d.classList.contains('on'));
    return {i: i < 0 ? 0 : i, n: dots.length};
  };

  let lastSlot = -1;
  const sync = () => {
    const hit = Array.from(strum.children).findIndex(el => el.classList.contains('hit'));
    if(hit !== lastSlot){
      lastSlot = hit;
      if(hit >= 0){
        app.dataset.slot = hit;
        pulse(hit === 0);
        const b = readBar();
        fine.innerHTML = 'такт <b>' + (b.i+1) + '</b>/' + b.n + ' · удар <b>' + (Math.floor(hit/2)+1) + '</b>/4';
      } else {
        delete app.dataset.slot;
      }
    }
    app.dataset.playing = play.classList.contains('on') ? '1' : '0';
  };

  new MutationObserver(sync).observe(strum, {subtree:true, attributes:true, attributeFilter:['class'], childList:true});
  new MutationObserver(sync).observe(play, {attributes:true, attributeFilter:['class']});
  new MutationObserver(() => {
    if(lastSlot < 0){ const b = readBar(); fine.innerHTML = 'такт <b>' + (b.i+1) + '</b>/' + b.n; }
  }).observe(document.getElementById('dots'), {subtree:true, attributes:true, attributeFilter:['class'], childList:true});

  /* плъзгачът се пълни независимо как е сменена стойността (влачене, preset, клавиш) */
  const paint = () => {
    const v = +bpm.value, lo = +bpm.min, hi = +bpm.max;
    fill.style.width = (5 + (v - lo) / (hi - lo) * 95) + '%';
  };
  bpm.addEventListener('input', paint);
  paint();

  /* дискретна индикация за зареждането на мострите */
  const probe = new Function('return {r: typeof coreReady!=="undefined"&&coreReady, f: typeof loadFailed!=="undefined"&&loadFailed, n: typeof smp!=="undefined"&&smp?smp.size:0}');
  let shown = false, done = false;
  setInterval(() => {
    paint();
    let st;
    try{ st = probe(); }catch(e){ return; }
    if(st.f){ chip.className = 'chip show err'; chipTxt.textContent = 'няма връзка към мострите'; return; }
    if(!st.r){
      if(!shown){ shown = true; chip.className = 'chip show'; }
      chipTxt.textContent = 'зареждам мострите на китарата';
      return;
    }
    chip.className = 'chip show ok';
    chipTxt.textContent = 'акустична китара · ' + st.n + ' мостри';
    if(!done){ done = true; setTimeout(() => { chip.className = 'chip'; }, 2600); }
  }, 300);
};

window.__polish();
</script>
